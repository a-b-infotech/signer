plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abinfotech.signer'
    compileSdk 34

    defaultConfig {
        applicationId "com.abinfotech.signer"
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName "2.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Standard Android Java APIs utilized natively without external bulky dependencies
}
